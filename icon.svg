<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0fdf4" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Decorative subtle background circle ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="12"/>

  <!-- Icon group centered with drop shadow -->
  <g filter="url(#shadow)">
    <!-- Wallet body -->
    <rect x="112" y="196" width="288" height="180" rx="28" fill="url(#cardGrad)" />
    
    <!-- Wallet flap top edge -->
    <path d="M112 220 C112 200, 132 196, 152 196 L360 196 C380 196, 400 200, 400 220 L400 228 L112 228 Z" fill="#e2e8f0" />

    <!-- Wallet clasp / pocket tag -->
    <path d="M304 248 L388 248 C395 248, 400 253, 400 260 L400 308 C400 315, 395 320, 388 320 L304 320 C292 320, 284 308, 284 284 C284 260, 292 248, 304 248 Z" fill="#10b981" />
    
    <!-- Clasp button / coin emblem -->
    <circle cx="340" cy="284" r="14" fill="url(#accentGrad)" />

    <!-- Golden Coin emerging from top of wallet -->
    <g transform="translate(0, -10)">
      <circle cx="224" cy="152" r="44" fill="url(#accentGrad)" stroke="#ffffff" stroke-width="6"/>
      <circle cx="224" cy="152" r="32" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="6,4"/>
      <!-- Dollar / Currency emblem -->
      <path d="M216 138 h16 M224 138 v28 M216 166 h16 M228 145 c0-5-8-5-8 0 c0 6 8 4 8 9 c0 5-8 5-8 0" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- Upward green growth trend line on wallet front -->
    <path d="M152 336 L200 296 L232 312 L296 256" fill="none" stroke="#10b981" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M272 256 L296 256 L296 280" fill="none" stroke="#10b981" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
